<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram for Nokia 3210</title>
    <style>
        /* Base styles optimized for a 240x320 screen */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 240px;
            height: 320px;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
        }
        /* Small widget header to confirm it's running via Cloud Phone */
        .widget-header {
            width: 100%;
            height: 24px;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: #ffffff;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        /* Container to frame the Instagram mobile view */
        .iframe-container {
            width: 240px;
            height: 296px; /* 320px total minus the 24px header */
            overflow: auto;
            -webkit-overflow-scrolling: touch;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Top indicator bar -->
    <div class="widget-header">Insta Mini</div>

    <!-- Embedded Instagram Mobile Web Application -->
    <div class="iframe-container">
        <iframe src="https://instagram.com" allowfullscreen></iframe>
    </div>

</body>
</html>
